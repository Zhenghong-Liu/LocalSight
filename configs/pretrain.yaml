extends: base.yaml
stage: pretrain
seed: 42

dataset: pretrain_t2t.jsonl        # 全量实测 2.13B tokens；开发冒烟换 pretrain_t2t_mini.jsonl
seq_len: 4096
packing: true
document_aware_mask: true

epochs: 5                          # 历史配置（中断点 LR 反算用）；实际预算由 max_total_tokens 控制
max_total_tokens: 5500000000       # 2026-08-15 用户决定：对齐 MiniMind 完整路线（约 5.5B tokens）
micro_batch_size: 32               # 每卡序列数
grad_accum: 4
# 有效 batch = 2 卡 x 32 x 4096 x 4 = 1,048,576 tokens
num_workers: 4                     # DataLoader 多进程（轻量提速套餐）
prefetch_factor: 2

optimizer:
  # 2D 矩阵 → Muon（Moonlight 公式）；1D/标量 → AdamW
  muon_momentum: 0.95
  muon_ns_steps: 5
  muon_scale: 0.2                  # W <- W - lr * (0.2 * O * sqrt(max(A,B)) + wd * W)
  adam_betas: [0.9, 0.95]
lr: 3.0e-3                         # mini 扫描结果：3e-3/0.1 最优（val 3.1576）
wd: 0.1                            # 扫描：wd=0.1 整体优于 0.05
warmup_ratio: 0.02
lr_min_ratio: 0.1                  # 衰减到峰值 10%

routing:
  balance_gamma: 1.0e-2            # 专家偏置更新步长（4 专家规模需放大到 1e-2）
  z_loss_alpha: 1.0e-3
  aux_loss_fallback: 1.0e-2        # 常开轻量 balance aux（top-1 小模型实测会坍缩）
  load_warn_pp: 20                 # 任一专家占比偏离 25% 超 20pp 告警

activation_recompute: full
soup_last_n: 3

# 断点与抽查（具体值由 scripts/launch_pretrain.sh 的 CLI 参数传入）
save_interval: 500                 # 提速后约 1.5~2h 一档；续训从 step-1000 起编号 step-1500/2000...
keep_last_checkpoints: 3
# eval_interval_sec: 3600（每小时 50 条 think 开/关 + 10 条续写 + val PPL）
# milestone_bench：每个 checkpoint 跑 MMLU/C-Eval 100 样本快评

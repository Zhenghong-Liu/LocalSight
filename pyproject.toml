[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localsight"
version = "0.1.0"
description = "LocalSight: 198M-A64M thinking MoE LLM trained on 2x RTX 4090"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = [
    "torch>=2.8",
    "transformers>=5.0",
    "tokenizers",
    "datasets",
    "accelerate",
    "trl",
    "safetensors",
    "pyyaml",
    "numpy",
    "wandb",
    "flash-attn",
    "triton",
]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
